project_name: kubectl-sick

builds:
  - id: kubectl-sick
    main: ./main.go
    binary: kubectl-sick
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: kubectl-sick
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: srujan-rai
    name: kubectl-sick

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
